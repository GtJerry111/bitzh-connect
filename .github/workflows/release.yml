name: build

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  update-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          VERSION="${TAG_VERSION#v}"
          CURRENT_VERSION=$(cat .app-version)

          echo "Current version: $CURRENT_VERSION"
          echo "New version from tag: $VERSION"

          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Updating .app-version to $VERSION"
            echo "$VERSION" > .app-version

            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"

            git add .app-version
            git commit -m "chore: bump version to $VERSION"
            git push origin HEAD:main
            echo "Version updated and committed"
          else
            echo "Version is already up to date, no changes needed"
          fi

  build:
    needs: [update-version]
    if: always()
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            os_name: darwin
            arch: amd64
            target_arch: x86_64
          - os: macos-latest
            os_name: darwin
            arch: arm64
            target_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv and restore cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.7.20"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install Dependencies
        run: uv sync --group build

      # tag 构建检出的是 tag 提交，这里按 tag 名覆盖，确保产物内嵌版本 === 发布版本
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > .app-version

      - name: Download ZJU-connect Core (macOS)
        run: |
          mkdir -p app/core
          curl -L "https://github.com/Mythologyli/zju-connect/releases/download/v1.3.1/zju-connect-darwin-${{ matrix.arch }}.zip" -o app/core/zju-connect.zip
          unzip -o app/core/zju-connect.zip -d app/core
          rm app/core/zju-connect.zip

      - name: Build Executable (macOS)
        run: |
          source .venv/bin/activate
          pyside6-rcc app/resources/resources.qrc -o app/common/resources.py

          python -m nuitka \
            --lto=yes \
            --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --include-data-files=app/core/zju-connect=app/core/zju-connect \
            --include-data-files=.app-version=.app-version \
            --macos-target-arch=${{ matrix.target_arch }} \
            --macos-create-app-bundle \
            --macos-app-icon=app/resources/icons/icon.icns \
            --macos-app-name="BITZH Connect" \
            --macos-app-version=$(cat .app-version) \
            --output-dir=dist \
            --remove-output \
            app/main.py

          mv dist/main.app "dist/BITZH Connect.app"

      - name: Assert artifact contents (macOS)
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/BITZH Connect.app"
          KERNEL="$APP/Contents/MacOS/app/core/zju-connect"
          if [ ! -f "$KERNEL" ]; then
            echo "::error::missing bundled kernel: $KERNEL"
            exit 1
          fi
          UNEXPECTED=$(find "$APP/Contents/MacOS/app" -mindepth 1 -maxdepth 1 ! -name core)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::unexpected files under packaged app/: $UNEXPECTED"
            exit 1
          fi
          echo "kernel OK: $KERNEL"
          uv run --no-sync python scripts/slim_audit.py artifact "$APP"

      - name: Build Privileged Helper (macOS)
        run: |
          source .venv/bin/activate
          PYTHONPATH=app python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --macos-target-arch=${{ matrix.target_arch }} \
            --output-dir=dist_helper \
            --output-filename=bitzh-helper \
            --remove-output \
            app/privileged_helper/main.py
          cp dist_helper/bitzh-helper "dist/BITZH Connect.app/Contents/MacOS/bitzh-helper"
          rm -rf dist_helper

      - name: Assert helper (macOS)
        run: test -f "dist/BITZH Connect.app/Contents/MacOS/bitzh-helper"

      - name: Create ZIP asset (in-app update)
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "dist/BITZH Connect.app" \
            "dist/bitzh-connect-darwin-${{ matrix.arch }}.zip"

      - name: Create DMG (macOS)
        run: |
          brew install create-dmg
          create-dmg \
            --volname "BITZH Connect" \
            --background "app/resources/installer/bg.svg" \
            --window-pos 400 200 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "BITZH Connect.app" 160 185 \
            --app-drop-link 500 185 \
            --add-file "安装说明.txt" "app/resources/installer/安装说明.txt" 160 300 \
            --add-file "修复并打开.command" "app/resources/installer/修复并打开.command" 500 300 \
            "dist/bitzh-connect-darwin-${{ matrix.arch }}.dmg" \
            "dist/BITZH Connect.app"

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 \
            "bitzh-connect-darwin-${{ matrix.arch }}.zip" \
            "bitzh-connect-darwin-${{ matrix.arch }}.dmg" \
            > "checksums-darwin-${{ matrix.arch }}.txt"

      - name: Archive Executable
        uses: actions/upload-artifact@v4
        with:
          name: bitzh-connect-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/checksums-*.txt
          if-no-files-found: error

  release:
    permissions: write-all
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release
          cp artifacts/*/*.dmg release/ 2>/dev/null || true
          cp artifacts/*/*.zip release/ 2>/dev/null || true
          cp artifacts/*/checksums-*.txt release/ 2>/dev/null || true

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## ${TAG}"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --invert-grep --grep='^chore: bump version' \
                --pretty='- %s' "${PREV}..${TAG}"
              echo
              echo "Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "- Initial release"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          bodyFile: release-notes.md
